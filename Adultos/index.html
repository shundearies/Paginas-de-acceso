<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Acceso TV</title>
    <meta name="theme-color" content="#0d0d11">
    
    <!-- Fuente moderna para interfaces de TV -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Helvetica, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d11;
        }

        /*=============================
        VIDEO DE FONDO
        ==============================*/
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            background: #0d0d11;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Degradado oscuro para mejorar el contraste del texto */
            background: linear-gradient(180deg, rgba(13,13,17,0.5) 0%, rgba(13,13,17,0.85) 100%);
            z-index: -2;
        }

        /*=============================
        CENTRAR LOGIN
        ==============================*/
        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 440px;
            padding: 40px 35px;
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
        }

        /*=============================
        LOGO Y TEXTOS
        ==============================*/
        #logo {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a5a5b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #sub {
            color: #9898a3;
            margin-bottom: 35px;
            font-size: 16px;
            font-weight: 400;
        }

        /*=============================
        ELEMENTOS DE FOCO (INPUT / BOTÓN)
        ==============================*/
        .remote-focus {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 18px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: block;
        }

        /* Input específico */
        input.remote-focus {
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            margin-bottom: 20px;
        }

        input.remote-focus::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input.remote-focus:focus {
            border-color: #00bfff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.45);
        }

        /* Botón específico */
        button.remote-focus {
            border: 2px solid transparent;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
        }

        button.remote-focus:hover {
            background: linear-gradient(135deg, #0084ff 0%, #0066d6 100%);
        }

        button.remote-focus:focus {
            border-color: #00ffff;
            background: linear-gradient(135deg, #00aaff 0%, #0077ff 100%);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }

        /*=============================
        MENSAJE DE ERROR
        ==============================*/
        #error {
            margin-top: 25px;
            min-height: 25px;
            font-size: 16px;
            color: #ff4d4d;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /*=============================
        SMART TV (PANTALLAS GRANDES)
        ==============================*/
        @media(min-width: 1400px) {
            #container {
                max-width: 650px;
                padding: 60px 50px;
                border-radius: 32px;
            }
            #logo { font-size: 44px; }
            #sub { font-size: 22px; margin-bottom: 45px; }
            .remote-focus { font-size: 24px; padding: 20px 24px; border-radius: 18px; }
            input.remote-focus { margin-bottom: 25px; }
            #error { font-size: 22px; }
        }

        /*=============================
        TABLET
        ==============================*/
        @media(max-width: 900px) {
            #container { max-width: 420px; }
        }

        /*=============================
        CELULAR
        ==============================*/
        @media(max-width: 600px) {
            #container {
                padding: 30px 24px;
                width: 85%;
            }
            #logo { font-size: 26px; }
            #sub { font-size: 15px; }
            .remote-focus { font-size: 16px; padding: 14px 18px; }
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay muted loop playsinline preload="auto">
        <source src="https://github.com/shundearies/skipperImg/raw/refs/heads/main/videoplayback.mp4" type="video/mp4">
    </video>

    <div id="overlay"></div>

    <div id="container">
        <div id="logo">MI PLATAFORMA</div>
        <div id="sub">Ingrese la contraseña para continuar</div>

        <input id="password" class="remote-focus" type="password" placeholder="Contraseña" tabindex="1" autocomplete="off">
        <button id="login" class="remote-focus" tabindex="2">INGRESAR</button>

        <div id="error"></div>
    </div>

    <script>
        /* [Tu JS original permanece exactamente igual e intacto aquí] */
        const PASSWORD = "123456";
        const REDIRECT = "https://www.google.com";

        const input = document.getElementById("password");
        const button = document.getElementById("login");
        const error = document.getElementById("error");

        const focusables = [input, button];
        let focusIndex = 0;

        function setFocus(index){
            if(index < 0) index = 0;
            if(index >= focusables.length) index = focusables.length - 1;
            focusIndex = index;
            focusables[focusIndex].focus();
        }

        window.addEventListener("load",()=>{
            setTimeout(()=>{ setFocus(0); },300);
        });

        function login(){
            error.textContent="";
            if(input.value === PASSWORD){
                window.location.href = REDIRECT;
                return;
            }
            error.textContent="Contraseña incorrecta";
            input.value="";
            setFocus(0);
        }

        button.addEventListener("click",login);
        input.addEventListener("keydown",(e)=>{
            if(e.key==="Enter"){ login(); }
        });

        document.addEventListener("keydown",(e)=>{
            switch(e.key){
                case "ArrowDown":
                    e.preventDefault();
                    if(focusIndex < focusables.length-1){ setFocus(focusIndex+1); }
                break;
                case "ArrowUp":
                    e.preventDefault();
                    if(focusIndex > 0){ setFocus(focusIndex-1); }
                break;
                case "ArrowLeft":
                case "ArrowRight":
                    e.preventDefault();
                break;
                case "Enter":
                case "NumpadEnter":
                    if(document.activeElement===button){ login(); }
                break;
                case "Escape":
                case "Backspace":
                    error.textContent="";
                break;
            }
        });

        document.addEventListener("focusin", (e) => {
            if (!focusables.includes(e.target)) { setFocus(focusIndex); }
        });

        focusables.forEach((el, i) => {
            el.addEventListener("focus", () => { focusIndex = i; });
        });

        const video = document.getElementById("bgVideo");
        function playVideo(){
            const p = video.play();
            if(p !== undefined){ p.catch(()=>{}); }
        }

        window.addEventListener("load", playVideo);
        document.addEventListener("click", playVideo);
        document.addEventListener("keydown", playVideo);
        video.addEventListener("pause", playVideo);
        video.addEventListener("ended", ()=>{
            video.currentTime = 0;
            playVideo();
        });

        document.addEventListener("keydown",(e)=>{
            const key = e.key;
            const code = e.keyCode;
            if(code === 13 || key === "Enter"){
                if(document.activeElement === button){
                    e.preventDefault();
                    login();
                }
            }
            if(code === 40){
                e.preventDefault();
                if(focusIndex < focusables.length - 1){ setFocus(focusIndex + 1); }
            }
            if(code === 38){
                e.preventDefault();
                if(focusIndex > 0){ setFocus(focusIndex - 1); }
            }
        });

        // Manejo nativo de transiciones CSS combinadas con el efecto scale de JS
        focusables.forEach(item=>{
            item.addEventListener("focus",()=>{ item.style.transform="scale(1.03)"; });
            item.addEventListener("blur",()=>{ item.style.transform="scale(1)"; });
        });

        setTimeout(()=>{ setFocus(0); },500);

        window.addEventListener("popstate", function () {
            error.textContent = "";
            setFocus(0);
        });

        document.addEventListener("keydown", function(e){
            if(e.key === "GoBack" || e.key === "BrowserBack"){
                e.preventDefault();
                error.textContent="";
                setFocus(0);
            }
        });

        setInterval(function(){
            if(document.activeElement !== input && document.activeElement !== button){
                setFocus(focusIndex);
            }
        },1000);
    </script>
</body>
</html>
