<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso Premium</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    /* Video de fondo */
    .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }

    /* Capa oscura para mejorar lectura */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.45);
        z-index: -1;
    }

    .container {
        text-align: center;
        background: rgba(0,0,0,0.35);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(5px);
    }

    h1 {
        font-size: 45px;
        color: #FFD700;
        text-shadow: 0 0 15px #FFD700;
        margin-bottom: 25px;
    }

    .link {
        font-size: 20px;
        color: white;
        margin-bottom: 25px;
        word-break: break-all;
    }

    button {
        background: linear-gradient(45deg, #FFD700, #FFA500);
        color: black;
        border: none;
        padding: 12px 35px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
        box-shadow: 0 0 20px #FFD700;
    }

    #mensaje {
        margin-top: 15px;
        color: #00ff99;
        font-size: 16px;
        display: none;
    }

    @media(max-width:600px){
        h1 {
            font-size: 32px;
        }

        .container {
            width: 90%;
            padding: 30px 20px;
        }

        .link {
            font-size: 16px;
        }
    }
</style>

</head>

<body>

<!-- Video de fondo -->
<video class="video-background" autoplay muted loop playsinline>
    <source src="https://github.com/shundearies/skipperImg/raw/refs/heads/main/Hidori.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
</video>

<div class="overlay"></div>


<div class="container">

    <h1>Acceso premium</h1>

    <div class="link" id="linkTexto">
        https://t.me/Super01Super01
    </div>

    <button onclick="copiarLink()">
        Copiar
    </button>

    <div id="mensaje">
        Link copiado correctamente
    </div>

</div>


<script>
function copiarLink() {

    const link = document.getElementById("linkTexto").innerText;

    navigator.clipboard.writeText(link)
    .then(() => {

        const mensaje = document.getElementById("mensaje");
        mensaje.style.display = "block";

        setTimeout(() => {
            mensaje.style.display = "none";
        }, 2000);

    })
    .catch(() => {
        alert("No se pudo copiar el enlace");
    });

}
</script>


</body>
</html>
